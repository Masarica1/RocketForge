# yaml-language-server: $schema=../schemas/learning-config.schema.json

env_config:
  exp_name: Run-2.0
  wandb_project_name: rocketforge
  progress_bar: true

  # randomness setting
  seed: 1
  randomize_initial_state: true
  torch_deterministic: false

  # env
  timeout: 21600
  action_period: 2
  
  # etc
  device: cuda
  
training_config:
  total_timesteps: 50000000
  learning_rate:
    type: linear
    start_value: 0.0003
    end_value: 0.00001
    end_ratio: 0.75
     
  num_envs: 8
  num_steps: 256
  gamma: 0.995
  gae_lambda: 0.95
  num_minibatches: 16
  update_epochs: 10
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: false
  ent_coef: 0.02
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.006
