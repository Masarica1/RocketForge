#:schema https://json.schemastore.org/pyproject.json

[project]
name = "rocketforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Masarica1", email = "leehyunho2006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "jaxtyping>=0.3.11",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "stable-baselines3[extra]>=2.9.0",
    "torch>=2.13.0",
    "tyro>=1.0.16",
    "wandb>=0.28.2",
]


[dependency-groups]
dev = [
    "ruff>=0.16.4",
]


[project.scripts]
hueristic-test = "learning.test.test:hueristic_test"
training-test = "learning.test.test:training_test"
model-test = "learning.test.test:model_test"

train = 'learning.scripts.train:train'


[build-system]
requires = ["scikit-build-core>=0.8", "pybind11"]
build-backend = "scikit_build_core.build"


[tool.scikit-build]
cmake.version = ">=3.15"
ninja.make-fallback = true
wheel.packages = ["learning"]
build-dir = "build/skbuild/{wheel_tag}"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "simulation/**/*.cpp" },
    { file = "simulation/**/*.hpp" },
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }


[tool.pyright]
typeCheckingMode = "standard"
